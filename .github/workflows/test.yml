# Run the test suite on Linux and on macOS's own /bin/bash (3.2, the floor
# stanza supports), and hold the shell sources to zero ShellCheck findings.
name: test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The suite validates JSON and bumps uv projects with uv
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
      - name: Test suite
        run: tests/run.sh

  macos-bash-3-2:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
      - name: /bin/bash is 3.2
        run: |
          /bin/bash --version
          [[ "$(/bin/bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')" == 3.2 ]]
      # run.sh puts a `bash` for its own interpreter first on PATH, so stanza's
      # `#!/usr/bin/env bash` resolves to /bin/bash rather than a newer bash.
      # The suite includes the zsh completion check, which skips on Linux
      - name: Test suite on /bin/bash
        run: /bin/bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
      # Pinned, so a ShellCheck release cannot fail CI on unchanged code.
      # .shellcheckrc tells it to follow each file's `source` statements
      - name: ShellCheck
        run: |
          uvx --from shellcheck-py==0.11.0.1 shellcheck \
            bin/stanza \
            lib/stanza-common lib/stanza-init lib/stanza-release lib/stanza-rules \
            completions/stanza.bash \
            install.sh uninstall.sh scripts/release-asset.sh \
            tests/run.sh
