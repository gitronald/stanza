# Publish the installer's release asset (stanza-<version>.tar.gz and its
# .sha256) on the GitHub release for each stable tag. stanza release pushes the
# tag; this builds and uploads the asset. Re-run it by hand with a tag to finish
# a release whose upload failed: the script skips whatever is already there.
name: release-asset

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the asset for (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          # The script reads git locally and calls gh with GH_TOKEN, so the
          # token need not stay in .git/config while tagged code runs
          persist-credentials: false
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/release-asset.sh "$TAG"
